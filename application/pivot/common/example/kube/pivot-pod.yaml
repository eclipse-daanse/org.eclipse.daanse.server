# Complete, self contained Daanse pivot demo as a Kubernetes pod - runs
# unchanged with Podman or a real cluster:
#
#   podman kube play pivot-pod.yaml        # or: kubectl apply -f pivot-pod.yaml
#   curl -X POST http://localhost:8080/xmla \
#     -H 'Content-Type: text/xml' \
#     -H 'SOAPAction: "urn:schemas-microsoft-com:xml-analysis:Execute"' \
#     -d '<SOAP-ENV:Envelope xmlns:SOAP-ENV="http://schemas.xmlsoap.org/soap/envelope/"><SOAP-ENV:Header/><SOAP-ENV:Body><Execute xmlns="urn:schemas-microsoft-com:xml-analysis"><Command><Statement>SELECT [Measures].[Measure-Sum] ON COLUMNS FROM [MinimalCube]</Statement></Command><Properties><PropertyList><Catalog>Daanse Tutorial - Cube Minimal</Catalog><Format>Multidimensional</Format></PropertyList></Properties></Execute></SOAP-ENV:Body></SOAP-ENV:Envelope>'
#
# The answer contains the cell value 6 (1+2+3). A PostgreSQL container seeded
# with a tiny fact table and the pivot share the pod; the catalog and the seed
# SQL come from the ConfigMaps below. On a real cluster replace the hostPort
# with a Service and the ConfigMap catalog with your own mapping.

apiVersion: v1
kind: ConfigMap
metadata:
  name: daanse-pivot-demo
data:
  init.sql: |
    CREATE TABLE "Fact" ("KEY" VARCHAR(100), "VALUE" INTEGER);
    INSERT INTO "Fact" VALUES ('A', 1), ('B', 2), ('C', 3);
  catalog.xmi: |
    <?xml version="1.0" encoding="UTF-8"?>
    <xmi:XMI xmi:version="2.0" xmlns:xmi="http://www.omg.org/XMI" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xmlns:businessinformation="http://www.omg.org/spec/CWM/1.1/foundation/businessinformation" xmlns:relational="http://www.omg.org/spec/CWM/1.1/resource/relational" xmlns:rolapcat="https://www.daanse.org/spec/org.eclipse.daanse.rolap.mapping/catalog" xmlns:rolapcube="https://www.daanse.org/spec/org.eclipse.daanse.rolap.mapping/olap/cube" xmlns:rolapmeas="https://www.daanse.org/spec/org.eclipse.daanse.rolap.mapping/olap/cube/measure" xmlns:rolapsrc="https://www.daanse.org/spec/org.eclipse.daanse.rolap.mapping/database/source">
      <rolapcat:Catalog xmi:id="_catalog_cube_minimal" name="Daanse Tutorial - Cube Minimal" importedElement="_schema">
        <ownedElement xsi:type="rolapsrc:TableSource" xmi:id="_tablesource_fact" name="Fact" table="_table_fact"/>
        <ownedElement xsi:type="rolapcube:PhysicalCube" xmi:id="_physicalcube_minimalcube" name="MinimalCube" source="_tablesource_fact">
          <measureGroups xmi:id="_measuregroup_minimalcube" name="MinimalCube">
            <measures xsi:type="rolapmeas:SumMeasure" xmi:id="_summeasure_measure_sum" name="Measure-Sum" column="_column_fact_value"/>
          </measureGroups>
        </ownedElement>
        <ownedElement xsi:type="businessinformation:Description" xmi:id="_description_cube_minimal_documentation_und" name="Daanse Tutorial - Cube Minimal_documentation_und" body="Basic cube structure with measures only" language="und" type="documentation" modelElement="_catalog_cube_minimal"/>
      </rolapcat:Catalog>
      <relational:SQLSimpleType xmi:id="_sqlsimpletype_character_varying" name="CHARACTER VARYING" typeNumber="12"/>
      <relational:SQLSimpleType xmi:id="_sqlsimpletype_integer" name="INTEGER" typeNumber="4"/>
      <relational:Schema xmi:id="_schema" importer="_catalog_cube_minimal">
        <ownedElement xsi:type="relational:Table" xmi:id="_table_fact" name="Fact">
          <feature xsi:type="relational:Column" xmi:id="_column_fact_key" name="KEY" type="_sqlsimpletype_character_varying"/>
          <feature xsi:type="relational:Column" xmi:id="_column_fact_value" name="VALUE" type="_sqlsimpletype_integer"/>
        </ownedElement>
      </relational:Schema>
    </xmi:XMI>
---
apiVersion: v1
kind: Pod
metadata:
  name: daanse-pivot-demo
spec:
  containers:
    - name: db
      image: docker.io/library/postgres:17-alpine
      env:
        - name: POSTGRES_DB
          value: demo
        - name: POSTGRES_USER
          value: daanse
        - name: POSTGRES_PASSWORD
          value: secret
      volumeMounts:
        - name: demo
          mountPath: /docker-entrypoint-initdb.d/init.sql
          subPath: init.sql
    - name: pivot
      image: docker.io/eclipsedaanse/daanse-pivot-postgres:snapshot
      ports:
        - containerPort: 8080
          hostPort: 8080
      env:
        - name: DAANSE_JDBC_HOST
          value: localhost   # containers in a pod share the network namespace
        - name: DAANSE_JDBC_DBNAME
          value: demo
        - name: DAANSE_JDBC_USER
          value: daanse
        - name: DAANSE_JDBC_PASSWORD
          value: secret
      volumeMounts:
        - name: demo
          mountPath: /app/catalog/catalog.xmi
          subPath: catalog.xmi
  volumes:
    - name: demo
      configMap:
        name: daanse-pivot-demo
